name: Build and deploy Jekyll site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # update-social-wall.yml and update-analytics.yml keep their data on
      # the site-data branch, since main only accepts approved PRs and a
      # scheduled bot can't get one. Lay those copies over main's (which
      # are just a fallback for local previews) before building.
      - name: Use the latest bot-updated data
        run: |
          if git fetch --depth=1 origin site-data; then
            git checkout FETCH_HEAD -- _data
          else
            echo "::warning::No site-data branch -- building with main's copy of the social wall and analytics data."
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
