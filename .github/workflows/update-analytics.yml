name: Update visit analytics

on:
  schedule:
    - cron: "17 6 * * *"  # once a day; time is arbitrary, chosen to avoid the top of the hour
    - cron: "17 18 * * *" # backup run 12h later, in case the morning schedule is dropped/delayed
  push:
    branches: [main] # also refresh whenever the live site changes
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Shared with update-social-wall.yml: both push to the site-data branch, so
# running one at a time stops their pushes racing each other (and stops a
# push landing right as the schedule fires from clashing with itself).
concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # The data files live on the site-data branch, not main: main only
      # accepts approved PRs, which a scheduled bot can't get. pages.yml
      # lays site-data's _data/ over main's when it builds. Check it out
      # alongside main (which still provides the script and _config.yml)
      # and start from its copy -- the all-time ledger is cumulative, so
      # the script must build on the latest one.
      - name: Check out site-data
        run: |
          git fetch --depth=1 origin site-data
          git worktree add --detach "$RUNNER_TEMP/site-data" FETCH_HEAD
          cp "$RUNNER_TEMP/site-data/_data/analytics.json" \
             "$RUNNER_TEMP/site-data/_data/analytics_totals.json" _data/

      - run: python3 .github/scripts/update_analytics.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_SITE_TAG: ${{ secrets.CLOUDFLARE_SITE_TAG }}

      - run: |
          cp _data/analytics.json _data/analytics_totals.json "$RUNNER_TEMP/site-data/_data/"
          cd "$RUNNER_TEMP/site-data"
          if git diff --quiet -- _data/analytics.json _data/analytics_totals.json; then
            echo "No change in analytics data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/analytics.json _data/analytics_totals.json
          git commit -m "Update visit analytics"
          git push origin HEAD:site-data

          # A push made with the default GITHUB_TOKEN doesn't trigger other
          # workflows' `push` events, and pages.yml only listens for pushes
          # to main anyway, so dispatch it directly to pick up this new data.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
