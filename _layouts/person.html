---
layout: default
---
<article class="person wrap">
  <header class="person-header">
    {% if page.photo %}
    <img class="person-photo" src="{{ page.photo | relative_url }}" alt="{{ page.name | default: page.title }}">
    {% endif %}
    <div>
      <h1>{{ page.name | default: page.title }}</h1>
      {% if page.role %}<p class="person-role">{{ page.role }}</p>{% endif %}
      {% if page.status == "alumni" %}<p class="person-status">Former lab member</p>{% endif %}
    </div>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
