---
layout: default
---
{% if page.header_image %}
{% if page.header_image_fit == 'contain' %}
<div class="page-header-band page-header-band-contain" style="background-image: url('{{ page.header_image | relative_url }}');" role="img" aria-label="{{ page.title }}"></div>
<article class="page wrap">
  <h1>{{ page.title }}</h1>
  <div class="prose">
    {{ content }}
  </div>
</article>
{% else %}
<div class="page-header-band" style="background-image: url('{{ page.header_image | relative_url }}');">
  <div class="page-header-band-content wrap">
    <h1>{{ page.title }}</h1>
  </div>
</div>
<article class="page wrap">
  <div class="prose">
    {{ content }}
  </div>
</article>
{% endif %}
{% else %}
<article class="page wrap">
  <h1>{{ page.title }}</h1>
  <div class="prose">
    {{ content }}
  </div>
</article>
{% endif %}
