---
layout: default
---
<article class="post wrap">
  <header class="post-header">
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
    <h1>{{ page.title }}</h1>
  </header>
  {% if page.banner_image %}
  <img class="post-banner" src="{{ page.banner_image | relative_url }}" alt="{{ page.banner_alt | default: page.title }}">
  {% endif %}
  <div class="prose">
    {{ content }}
  </div>
</article>
