---
layout: default
---
<div class="hero" style="background-image: url('{{ page.hero_image | relative_url }}');">
  <div class="hero-content wrap">
    <h1>{{ site.title }}</h1>
    <p class="hero-tagline">{{ site.description }}</p>
  </div>
</div>

<article class="page wrap">
  <div class="prose intro-prose">
    {{ content }}
  </div>
  <div class="home-links">
    <a class="home-link" href="{{ '/people/' | relative_url }}">Meet the group &rarr;</a>
    <a class="home-link" href="{{ '/research/' | relative_url }}">Our research &rarr;</a>
    <a class="home-link" href="{{ '/updates/' | relative_url }}">Latest news &rarr;</a>
  </div>
</article>

{% if page.feature_image %}
<div class="feature-band" style="background-image: url('{{ page.feature_image | relative_url }}');">
  <div class="feature-band-caption wrap">
    <p>{{ page.feature_caption }}</p>
  </div>
</div>
{% endif %}
